<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazar Letras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Print/molde fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&family=ABeeZee&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #f5f0e8; min-height: 100vh; }

.ui {
background: linear-gradient(135deg,#4fc3f715,#81c78415);
border-bottom: 2px solid #ddd5c8;
padding: 20px 16px 16px;
display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
}
.ui h1 {
width: 100%; text-align: center;
font-family: ‘Fredoka One’, cursive;
font-size: 1.7rem; color: #e53935;
}
.ui p { width: 100%; text-align: center; font-size: 0.8rem; color: #aaa; margin-top: -4px; }

#word-inputs {
width: 100%; max-width: 580px;
display: flex; flex-direction: column; gap: 7px; margin: 0 auto;
}

.word-row {
display: flex; gap: 7px; align-items: center;
background: #fff; border-radius: 10px; padding: 7px 11px;
border: 1.5px solid #e0d8d0; flex-wrap: wrap;
}
.word-row label { font-size: 0.7rem; color: #ccc; }
.word-row input[type=“text”] {
font-family: ‘Nunito’, sans-serif; font-size: 0.87rem;
border: 1.5px solid #e0e0e0; border-radius: 7px; padding: 5px 9px; outline: none;
}
.word-row input[type=“text”]:focus { border-color: #e53935; }
.inp-word  { width: 150px; }
.inp-emoji { width: 68px; }
.word-row input[type=“color”] {
width: 27px; height: 27px; border: none; border-radius: 50%; cursor: pointer; padding: 0;
}

.btn {
font-family: ‘Fredoka One’, cursive; border: none; border-radius: 10px;
cursor: pointer; padding: 9px 20px; font-size: 0.95rem;
transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px #0002; }
.btn:active { transform: translateY(1px); }
.btn-add    { background: #b2dfdb; color: #00695c; }
.btn-remove { background: #ffcdd2; color: #c62828; padding: 6px 10px; font-size: 0.85rem; }
.btn-gen    { background: #5c6bc0; color: #fff; }
.btn-dl     { background: #e53935; color: #fff; }

.btn-row { width: 100%; display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
#status { width: 100%; text-align: center; font-size: 0.82rem; font-weight: 700; color: #5c6bc0; min-height: 18px; }

#worksheet {
width: 794px;
margin: 28px auto 40px;
padding: 44px 52px;
background: #fff;
border-radius: 14px;
box-shadow: 0 6px 26px #0001;
}

.ws-title {
font-family: ‘ABeeZee’, sans-serif;
font-size: 1.6rem; text-align: center;
letter-spacing: 3px; text-transform: uppercase;
color: #222; margin-bottom: 32px;
}

.ws-row {
display: flex; align-items: center; gap: 20px;
margin-bottom: 14px;
}

.ws-emoji { font-size: 46px; width: 62px; text-align: center; flex-shrink: 0; line-height: 1; }
.writing-area { flex: 1; }
.writing-area canvas { display: block; width: 100%; }

#ws-placeholder { text-align: center; color: #ddd; padding: 48px 0; }
</style>

</head>
<body>

<div class="ui">
  <h1>✏️ Trazar Letras</h1>
  <p>Letras en molde con líneas guía — genera y descarga en PDF</p>
  <div id="word-inputs"></div>
  <div id="status"></div>
  <div class="btn-row">
    <button class="btn btn-add" onclick="addRow()">+ Agregar</button>
    <button class="btn btn-gen" onclick="renderSheet()">🖊 Generar</button>
    <button class="btn btn-dl"  onclick="downloadPDF()">⬇ Descargar PDF</button>
  </div>
</div>

<div id="worksheet">
  <div class="ws-title">Trazar Letras</div>
  <div id="ws-body">
    <div id="ws-placeholder">Agrega palabras y presiona Generar</div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

const emojiMap = {
  perro:'🐶', gato:'🐱', pez:'🐟', rana:'🐸', vaca:'🐄', cerdo:'🐷',
  pato:'🦆', conejo:'🐰', oso:'🐻', caballo:'🐴', abeja:'🐝', hormiga:'🐜',
  caracol:'🐌', araña:'🕷️', gusano:'🪱', sol:'☀️', luna:'🌙', estrella:'⭐',
  arbol:'🌳', árbol:'🌳', flor:'🌸', manzana:'🍎', banana:'🍌', pastel:'🎂',
  pelota:'⚽', libro:'📚', carro:'🚗', avion:'✈️', avión:'✈️', casa:'🏠',
  mar:'🌊', agua:'💧', fuego:'🔥', nube:'☁️', lluvia:'🌧️', niño:'👦',
  niña:'👧', mama:'👩', papa:'👨', bebe:'👶', bebé:'👶', pajaro:'🐦',
  pájaro:'🐦', tigre:'🐯', elefante:'🐘', jirafa:'🦒', leon:'🦁', león:'🦁',
  serpiente:'🐍', mariposa:'🦋', mono:'🐒', pez:'🐟', toro:'🐂',
};

const palette = ['#e53935','#1565c0','#2e7d32','#6a1b9a','#e65100','#00695c','#827717','#283593'];
let rows = [], ci = 0;

function addRow(word='', emoji='') {
  rows.push({ id: Date.now()+Math.random(), word, emoji, color: palette[ci++ % palette.length] });
  renderUI();
}
function removeRow(id) { rows = rows.filter(r=>r.id!==id); renderUI(); }
function update(id, field, val) { const r=rows.find(r=>r.id===id); if(r) r[field]=val; }
function getEmoji(word, ov) { return (ov&&ov.trim()) ? ov.trim() : (emojiMap[word.toLowerCase().trim()]||'🔤'); }

function renderUI() {
  const c = document.getElementById('word-inputs');
  c.innerHTML = '';
  rows.forEach(row => {
    const d = document.createElement('div');
    d.className = 'word-row';
    d.innerHTML = `
      <label>Palabra</label>
      <input type="text" class="inp-word" value="${row.word}" placeholder="ej: perro"
        oninput="update(${row.id},'word',this.value)">
      <label>Emoji</label>
      <input type="text" class="inp-emoji" value="${row.emoji}" placeholder="auto"
        oninput="update(${row.id},'emoji',this.value)">
      <label>Color</label>
      <input type="color" value="${row.color}" oninput="update(${row.id},'color',this.value)">
      <button class="btn btn-remove" onclick="removeRow(${row.id})">✕</button>
    `;
    c.appendChild(d);
  });
}

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/**
 * Draws a molde (print) word with guide lines on canvas.
 * Font: ABeeZee — clean, upright, single-stroke feel, classroom standard.
 */
function makeWordCanvas(word, hexColor) {
  const SCALE    = 3;
  const CW       = 680;
  const CH       = 96;
  const FS       = 62;
  const TOPLINE  = 10;
  const BASELINE = 74;
  const MIDLINE  = TOPLINE + (BASELINE - TOPLINE) * 0.5;
  const DESCEND  = CH - 6;

  const c = document.createElement('canvas');
  c.width  = CW * SCALE;
  c.height = CH * SCALE;
  c.style.width  = CW + 'px';
  c.style.height = CH + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // ── Guide lines ──
  // Top line — solid light blue
  ctx.strokeStyle = '#90caf9';
  ctx.lineWidth = 0.8;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(0,TOPLINE); ctx.lineTo(CW,TOPLINE); ctx.stroke();

  // Mid line — dashed red/pink
  ctx.strokeStyle = '#ef9a9a';
  ctx.lineWidth = 0.7;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(0,MIDLINE); ctx.lineTo(CW,MIDLINE); ctx.stroke();

  // Baseline — solid blue
  ctx.strokeStyle = '#64b5f6';
  ctx.lineWidth = 1.1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(0,BASELINE); ctx.lineTo(CW,BASELINE); ctx.stroke();

  // Descender line — dashed light gray
  ctx.strokeStyle = '#bdbdbd';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(0,DESCEND); ctx.lineTo(CW,DESCEND); ctx.stroke();

  ctx.setLineDash([]);

  // ── Text ──
  const FONT = `${FS}px "ABeeZee", sans-serif`;
  ctx.font = FONT;
  ctx.textBaseline = 'alphabetic';

  // Ghost fill (very faint)
  ctx.fillStyle = hexToRgba(hexColor, 0.07);
  ctx.fillText(word, 8, BASELINE);

  // Dashed thin stroke — molde style
  ctx.strokeStyle = hexColor;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 4]);
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeText(word, 8, BASELINE);

  ctx.setLineDash([]);
  return c;
}

function renderSheet() {
  const valid = rows.filter(r => r.word.trim());
  const body  = document.getElementById('ws-body');
  body.innerHTML = '';

  if (!valid.length) {
    body.innerHTML = '<div id="ws-placeholder">Agrega palabras y presiona Generar</div>';
    setStatus('⚠️ No hay palabras'); return;
  }

  document.fonts.ready.then(() => {
    valid.forEach(row => {
      const word = row.word.trim();
      const div  = document.createElement('div');
      div.className = 'ws-row';

      const em = document.createElement('div');
      em.className = 'ws-emoji';
      em.textContent = getEmoji(word, row.emoji);

      const area = document.createElement('div');
      area.className = 'writing-area';
      area.appendChild(makeWordCanvas(word, row.color));

      div.appendChild(em); div.appendChild(area);
      body.appendChild(div);
    });

    setStatus('✅ Hoja generada');
    setTimeout(() => setStatus(''), 3000);
  });
}

async function downloadPDF() {
  const wsRows = document.querySelectorAll('#ws-body .ws-row');
  if (!wsRows.length) { setStatus('⚠️ Primero presiona Generar'); return; }

  setStatus('⏳ Generando PDF...');
  await document.fonts.ready;

  try {
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
    const pW=215.9, pH=279.4, mg=16;
    const usableW = pW - mg*2;

    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.setTextColor(30,30,30);
    doc.text('TRAZAR LETRAS', pW/2, 17, { align:'center' });
    doc.setDrawColor(200,190,180);
    doc.setLineWidth(0.4);
    doc.line(mg, 21, pW-mg, 21);

    let y = 27;

    for (const wsRow of wsRows) {
      const emojiEl = wsRow.querySelector('.ws-emoji');
      const cnv     = wsRow.querySelector('canvas');
      if (!cnv) continue;

      const traceW = usableW - 20;
      const traceH = (cnv.height / cnv.width) * traceW / 3; // SCALE=3

      if (y + traceH + 5 > pH - mg) { doc.addPage(); y = mg; }

      // Emoji
      const eC = document.createElement('canvas');
      eC.width = 80; eC.height = 80;
      const eCtx = eC.getContext('2d');
      eCtx.font = '62px serif';
      eCtx.textAlign = 'center'; eCtx.textBaseline = 'middle';
      eCtx.fillText(emojiEl.textContent, 40, 40);
      await new Promise(r => setTimeout(r, 30));
      doc.addImage(eC.toDataURL('image/png'), 'PNG', mg, y + traceH/2 - 7, 15, 15);

      // Word canvas
      doc.addImage(cnv.toDataURL('image/png'), 'PNG', mg+17, y, traceW, traceH);

      // Separator
      doc.setDrawColor(220,210,190);
      doc.setLineWidth(0.2);
      doc.setLineDashPattern([1,1.8],0);
      doc.line(mg, y+traceH+3, pW-mg, y+traceH+3);
      doc.setLineDashPattern([],0);

      y += traceH + 8;
    }

    doc.save('trazar-letras.pdf');
    setStatus('✅ Guardado como trazar-letras.pdf');
    setTimeout(() => setStatus(''), 4000);
  } catch(e) {
    console.error(e);
    setStatus('❌ Error: ' + e.message);
  }
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Defaults
['perro','gato','sol','casa','árbol'].forEach(w => addRow(w));
</script>

</body>
</html>
